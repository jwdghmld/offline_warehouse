<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Airflow 每日调度链路</title>
  <desc id="desc">四个 Airflow DAG 以同一个 target_ds 严格串行完成 ODS、DWD、DWS、ADS 和 MySQL 发布。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.075"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0071e3"/></marker>
    <style>.display{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.lead{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#6e6e73}.eyebrow{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#0071e3}.title{font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.body{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#515154}.meta{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#86868b}.num{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#ffffff}.line{fill:none;stroke:#0071e3;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="720" fill="#f5f5f7"/>
  <text x="82" y="68" class="eyebrow">AIRFLOW ORCHESTRATION</text>
  <text x="82" y="124" class="display">每日离线任务编排</text>
  <text x="82" y="164" class="lead">四个 DAG 严格串行，同一个 target_ds 从 ODS 采集贯穿至结果发布。</text>

  <!-- Connection lines use the horizontal gutter and never cross card content. -->
  <path d="M438 405H478" class="line"/><path d="M858 405H898" class="line"/><path d="M1278 405H1318" class="line"/>

  <g filter="url(#shadow)">
    <rect x="58" y="230" width="380" height="350" rx="30" fill="#ffffff"/>
    <circle cx="104" cy="282" r="22" fill="#0071e3"/><text x="104" y="289" text-anchor="middle" class="num">1</text>
    <text x="142" y="290" class="title">offline_ods_daily</text>
    <rect x="86" y="326" width="100" height="30" rx="15" fill="#e8f4ff"/><text x="136" y="346" text-anchor="middle" class="meta" fill="#0071e3">每日 02:00</text>
    <text x="86" y="400" class="body">校验目标业务日期</text><text x="86" y="442" class="body">JDBC 采集五张 ODS</text><text x="86" y="484" class="body">源端与目标分区逐表对账</text><text x="86" y="526" class="meta">成功后触发 DWD DAG</text>

    <rect x="478" y="230" width="380" height="350" rx="30" fill="#ffffff"/>
    <circle cx="524" cy="282" r="22" fill="#ff9f0a"/><text x="524" y="289" text-anchor="middle" class="num">2</text>
    <text x="562" y="290" class="title">offline_dwd_daily</text>
    <text x="506" y="382" class="body">交易支付明细快照</text><text x="506" y="424" class="body">用户行为明细快照</text><text x="506" y="466" class="body">店铺评分明细快照</text><text x="506" y="526" class="meta">三项串行完成后触发 DWS / ADS</text>

    <rect x="898" y="230" width="380" height="350" rx="30" fill="#ffffff"/>
    <circle cx="944" cy="282" r="22" fill="#af52de"/><text x="944" y="289" text-anchor="middle" class="num">3</text>
    <text x="982" y="290" class="title">offline_dws_ads_daily</text>
    <text x="926" y="382" class="body">3 张 DWS 公共主题汇总</text><text x="926" y="424" class="body">3 张 ADS 页面主题结果</text><text x="926" y="466" class="body">1d / 7d / 30d / all</text><text x="926" y="526" class="meta">ADS 对账成功后触发 Publish</text>

    <rect x="1318" y="230" width="424" height="350" rx="30" fill="#ffffff"/>
    <circle cx="1364" cy="282" r="22" fill="#34c759"/><text x="1364" y="289" text-anchor="middle" class="num">4</text>
    <text x="1402" y="290" class="title">offline_publish_daily</text>
    <text x="1346" y="382" class="body">发布经营总览</text><text x="1346" y="424" class="body">发布 SKU TopN</text><text x="1346" y="466" class="body">发布店铺评分</text><text x="1346" y="508" class="body">结果校验与成功通知</text>
  </g>

  <rect x="58" y="628" width="1684" height="54" rx="20" fill="#ffffff"/>
  <text x="900" y="662" text-anchor="middle" class="body">max_active_runs = 1　·　max_active_tasks = 1　·　上游成功后传递同一 target_ds　·　任一阶段失败即停止下游</text>
</svg>
