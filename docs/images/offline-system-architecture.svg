<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">电商离线数仓总体架构</title>
  <desc id="desc">Spark JDBC 从 MySQL 业务源采集数据，经过 ODS、DIM、DWD、DWS、ADS 分层后发布到 MySQL offline，Airflow 负责任务编排。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#86868b"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0071e3"/></marker>
    <style>
      .display{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.lead{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#6e6e73}.eyebrow{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#0071e3}.cardTitle{font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.body{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#515154}.meta{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#86868b}.badge{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.line{fill:none;stroke:#86868b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.blueLine{fill:none;stroke:#0071e3;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}.dash{fill:none;stroke:#a1a1a6;stroke-width:2.5;stroke-dasharray:9 9;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="#f5f5f7"/>
  <text x="86" y="70" class="eyebrow">OFFLINE DATA PLATFORM</text>
  <text x="86" y="126" class="display">电商离线数仓总体架构</text>
  <text x="86" y="166" class="lead">从业务源表到分层指标结果，批处理主链路可重跑、可追溯、可校验。</text>

  <!-- Connectors are rendered before cards and stay inside whitespace channels. -->
  <path d="M530 305H720" class="line"/>
  <path d="M900 390V456H190V500" class="blueLine"/>
  <path d="M1450 390V438H1030V390" class="dash"/>
  <path d="M310 635H350" class="blueLine"/>
  <path d="M590 635H630" class="blueLine"/>
  <path d="M870 635H910" class="blueLine"/>
  <path d="M1150 635H1190" class="blueLine"/>
  <path d="M1430 635H1470" class="blueLine"/>

  <g filter="url(#shadow)">
    <rect x="170" y="220" width="360" height="170" rx="26" fill="#ffffff"/>
    <circle cx="216" cy="266" r="22" fill="#fff4e5"/><ellipse cx="216" cy="260" rx="12" ry="5" fill="none" stroke="#ff9f0a" stroke-width="2.5"/><path d="M204 260v14c0 3 5 6 12 6s12-3 12-6v-14" fill="none" stroke="#ff9f0a" stroke-width="2.5"/>
    <text x="250" y="274" class="cardTitle">MySQL 业务源库</text>
    <text x="198" y="322" class="body">2 张维表 + 5 张事实表</text><text x="198" y="352" class="meta">离线 ODS 的统一采集入口</text>

    <rect x="720" y="220" width="360" height="170" rx="26" fill="#ffffff"/>
    <circle cx="766" cy="266" r="22" fill="#eaf8ef"/><path d="M754 274l8-9 7 6 10-14" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="274" class="cardTitle">Spark JDBC / SQL</text>
    <text x="748" y="322" class="body">显式字段、日期范围、分区覆盖</text><text x="748" y="352" class="meta">源端与目标端逐阶段核对</text>

    <rect x="1270" y="220" width="360" height="170" rx="26" fill="#ffffff"/>
    <circle cx="1316" cy="266" r="22" fill="#f3ecff"/><path d="M1305 267h22M1316 256v22" stroke="#af52de" stroke-width="3" stroke-linecap="round"/>
    <text x="1350" y="274" class="cardTitle">Airflow</text>
    <text x="1298" y="322" class="body">四个 DAG 严格串行</text><text x="1298" y="352" class="meta">统一编排并传递 target_ds</text>
  </g>

  <text x="70" y="474" class="eyebrow">WAREHOUSE LAYERS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="500" width="240" height="270" rx="26" fill="#ffffff"/>
    <rect x="94" y="524" width="58" height="28" rx="14" fill="#e8f4ff"/><text x="123" y="543" text-anchor="middle" class="badge" fill="#0071e3">ODS</text>
    <text x="94" y="594" class="cardTitle">原始数据层</text><text x="94" y="632" class="body">5 张日增量表</text><text x="94" y="664" class="meta">ds = 业务发生日</text><text x="94" y="724" class="meta">保留源字段与历史分区</text>

    <rect x="350" y="500" width="240" height="270" rx="26" fill="#ffffff"/>
    <rect x="374" y="524" width="58" height="28" rx="14" fill="#eaf8ef"/><text x="403" y="543" text-anchor="middle" class="badge" fill="#248a3d">DIM</text>
    <text x="374" y="594" class="cardTitle">公共维度层</text><text x="374" y="632" class="body">店铺与 SKU</text><text x="374" y="664" class="meta">无分区全量维度</text><text x="374" y="724" class="meta">独立维护，不进入每日 DAG</text>

    <rect x="630" y="500" width="240" height="270" rx="26" fill="#ffffff"/>
    <rect x="654" y="524" width="62" height="28" rx="14" fill="#fff4e5"/><text x="685" y="543" text-anchor="middle" class="badge" fill="#c93400">DWD</text>
    <text x="654" y="594" class="cardTitle">明细数据层</text><text x="654" y="632" class="body">3 张有效事实快照</text><text x="654" y="664" class="meta">ds = 快照截止日</text><text x="654" y="724" class="meta">清洗时序、金额与重复支付</text>

    <rect x="910" y="500" width="240" height="270" rx="26" fill="#ffffff"/>
    <rect x="934" y="524" width="62" height="28" rx="14" fill="#f3ecff"/><text x="965" y="543" text-anchor="middle" class="badge" fill="#8944ab">DWS</text>
    <text x="934" y="594" class="cardTitle">公共汇总层</text><text x="934" y="632" class="body">站点 / SKU / 店铺</text><text x="934" y="664" class="meta">1d / 7d / 30d / all</text><text x="934" y="724" class="meta">复用主题指标，降低重复计算</text>

    <rect x="1190" y="500" width="240" height="270" rx="26" fill="#ffffff"/>
    <rect x="1214" y="524" width="60" height="28" rx="14" fill="#fff0ef"/><text x="1244" y="543" text-anchor="middle" class="badge" fill="#d70015">ADS</text>
    <text x="1214" y="594" class="cardTitle">应用数据层</text><text x="1214" y="632" class="body">总览 / TopN / 评分</text><text x="1214" y="664" class="meta">ds = 展示截止日</text><text x="1214" y="724" class="meta">面向最终查询粒度</text>

    <rect x="1470" y="500" width="260" height="270" rx="26" fill="#ffffff"/>
    <rect x="1494" y="524" width="92" height="28" rx="14" fill="#eaf8ef"/><text x="1540" y="543" text-anchor="middle" class="badge" fill="#248a3d">SERVING</text>
    <text x="1494" y="594" class="cardTitle">MySQL offline</text><text x="1494" y="632" class="body">3 张 ADS 结果表</text><text x="1494" y="664" class="meta">按 ds 保留历史</text><text x="1494" y="724" class="meta">面向结果查询与展示</text>
  </g>

  <rect x="70" y="830" width="1660" height="130" rx="26" fill="#ffffff"/>
  <text x="100" y="870" class="eyebrow">RELIABILITY</text>
  <text x="100" y="910" class="body">事务完整性</text><text x="235" y="910" class="meta">MySQL 五张事实表整体提交或回滚</text>
  <text x="660" y="910" class="body">幂等重跑</text><text x="770" y="910" class="meta">Hive 分区覆盖、MySQL 主键替换、统一 target_ds</text>
  <text x="1280" y="910" class="body">职责清晰</text><text x="1390" y="910" class="meta">Spark 负责批计算，Airflow 负责编排</text>
</svg>
