<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">离线数仓分层与表作用</title>
  <desc id="desc">展示 MySQL 源表、ODS、DIM、DWD、DWS、ADS 和 MySQL 结果表的层次关系、主要表和日期语义。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.075"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#86868b"/></marker>
    <style>.display{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.lead{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#6e6e73}.eyebrow{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.title{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.section{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.body{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#515154}.meta{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#86868b}.line{fill:none;stroke:#86868b;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="980" fill="#f5f5f7"/>
  <text x="82" y="68" class="eyebrow" fill="#0071e3">WAREHOUSE MODEL</text>
  <text x="82" y="124" class="display">离线数仓分层与表作用</text>
  <text x="82" y="164" class="lead">每一层只承担明确职责，日期语义和输入输出边界保持稳定。</text>

  <!-- Lines stay in the 34px gutters and are drawn before cards. -->
  <path d="M312 535H338" class="line"/><path d="M592 535H618" class="line"/><path d="M872 535H898" class="line"/><path d="M1152 535H1178" class="line"/><path d="M1432 535H1458" class="line"/>

  <g filter="url(#shadow)">
    <rect x="52" y="220" width="260" height="630" rx="28" fill="#ffffff"/>
    <circle cx="94" cy="266" r="20" fill="#fff4e5"/><text x="126" y="274" class="eyebrow" fill="#c93400">SOURCE</text>
    <text x="80" y="326" class="title">MySQL 源库</text>
    <text x="80" y="376" class="section">基础维度</text><text x="80" y="410" class="body">shop_info</text><text x="80" y="440" class="body">sku_info</text>
    <line x1="80" y1="470" x2="284" y2="470" stroke="#e5e5ea"/>
    <text x="80" y="510" class="section">每日事实</text><text x="80" y="544" class="body">order_info</text><text x="80" y="574" class="body">order_detail</text><text x="80" y="604" class="body">payment_info</text><text x="80" y="634" class="body">user_behavior</text><text x="80" y="664" class="body">rating_info</text>
    <line x1="80" y1="696" x2="284" y2="696" stroke="#e5e5ea"/>
    <text x="80" y="736" class="section">边界</text><text x="80" y="770" class="meta">单事务覆盖</text><text x="80" y="798" class="meta">ODS 唯一来源</text>

    <rect x="338" y="220" width="254" height="630" rx="28" fill="#ffffff"/>
    <circle cx="380" cy="266" r="20" fill="#e8f4ff"/><text x="412" y="274" class="eyebrow" fill="#0071e3">ODS</text>
    <text x="366" y="326" class="title">原始数据层</text>
    <text x="366" y="376" class="body">ods_order_info_di</text><text x="366" y="410" class="body">ods_order_detail_di</text><text x="366" y="444" class="body">ods_payment_info_di</text><text x="366" y="478" class="body">ods_user_behavior_di</text><text x="366" y="512" class="body">ods_rating_info_di</text>
    <line x1="366" y1="550" x2="564" y2="550" stroke="#e5e5ea"/>
    <text x="366" y="590" class="section">主要作用</text><text x="366" y="624" class="meta">保留原始业务字段</text><text x="366" y="652" class="meta">形成可追溯历史分区</text>
    <text x="366" y="714" class="section">日期语义</text><text x="366" y="748" class="meta">ds = 业务发生日</text><text x="366" y="790" class="meta">静态覆盖目标分区</text>

    <rect x="618" y="220" width="254" height="630" rx="28" fill="#ffffff"/>
    <circle cx="660" cy="266" r="20" fill="#eaf8ef"/><text x="692" y="274" class="eyebrow" fill="#248a3d">DIM</text>
    <text x="646" y="326" class="title">公共维度层</text>
    <text x="646" y="382" class="body">dim_shop_df</text><text x="646" y="418" class="body">dim_sku_df</text>
    <line x1="646" y1="458" x2="844" y2="458" stroke="#e5e5ea"/>
    <text x="646" y="500" class="section">主要作用</text><text x="646" y="534" class="meta">补充店铺、商品与类目</text><text x="646" y="562" class="meta">统一维度名称与归属</text>
    <text x="646" y="624" class="section">日期语义</text><text x="646" y="658" class="meta">无 ds，全量维度</text>
    <text x="646" y="720" class="section">更新方式</text><text x="646" y="754" class="meta">独立初始化与维护</text><text x="646" y="782" class="meta">不进入每日 DAG</text>

    <rect x="898" y="220" width="254" height="630" rx="28" fill="#ffffff"/>
    <circle cx="940" cy="266" r="20" fill="#fff4e5"/><text x="972" y="274" class="eyebrow" fill="#c93400">DWD</text>
    <text x="926" y="326" class="title">明细数据层</text>
    <text x="926" y="376" class="body">dwd_trd_pay_dtl_df</text><text x="926" y="410" class="body">dwd_user_behavior_df</text><text x="926" y="444" class="body">dwd_shop_rating_df</text>
    <line x1="926" y1="482" x2="1124" y2="482" stroke="#e5e5ea"/>
    <text x="926" y="524" class="section">主要作用</text><text x="926" y="558" class="meta">关联公共维度</text><text x="926" y="586" class="meta">清洗时序、金额和重复支付</text><text x="926" y="614" class="meta">形成统一有效事实</text>
    <text x="926" y="676" class="section">日期语义</text><text x="926" y="710" class="meta">ds = 快照截止日</text><text x="926" y="738" class="meta">读取 ODS ds ≤ target_ds</text>

    <rect x="1178" y="220" width="254" height="630" rx="28" fill="#ffffff"/>
    <circle cx="1220" cy="266" r="20" fill="#f3ecff"/><text x="1252" y="274" class="eyebrow" fill="#8944ab">DWS</text>
    <text x="1206" y="326" class="title">公共汇总层</text>
    <text x="1206" y="376" class="body">dws_site_stats_df</text><text x="1206" y="410" class="body">dws_sku_trade_df</text><text x="1206" y="444" class="body">dws_shop_rating_df</text>
    <line x1="1206" y1="482" x2="1404" y2="482" stroke="#e5e5ea"/>
    <text x="1206" y="524" class="section">主要作用</text><text x="1206" y="558" class="meta">沉淀站点、SKU、店铺指标</text><text x="1206" y="586" class="meta">减少 ADS 重复计算</text>
    <text x="1206" y="648" class="section">统计周期</text><text x="1206" y="682" class="meta">1d / 7d / 30d / all</text>
    <text x="1206" y="744" class="section">读取范围</text><text x="1206" y="778" class="meta">同一 target_ds 的 DWD</text>

    <rect x="1458" y="220" width="290" height="630" rx="28" fill="#ffffff"/>
    <circle cx="1500" cy="266" r="20" fill="#fff0ef"/><text x="1532" y="274" class="eyebrow" fill="#d70015">ADS / SERVING</text>
    <text x="1486" y="326" class="title">应用与查询层</text>
    <text x="1486" y="376" class="body">ads_biz_overview_df</text><text x="1486" y="410" class="body">ads_sku_topn_df</text><text x="1486" y="444" class="body">ads_shop_rating_df</text>
    <line x1="1486" y1="482" x2="1720" y2="482" stroke="#e5e5ea"/>
    <text x="1486" y="524" class="section">主要作用</text><text x="1486" y="558" class="meta">面向总览、排行和评分主题</text><text x="1486" y="586" class="meta">控制最终页面查询粒度</text>
    <text x="1486" y="648" class="section">发布目标</text><text x="1486" y="682" class="meta">MySQL offline 同名表</text>
    <text x="1486" y="744" class="section">日期语义</text><text x="1486" y="778" class="meta">ds = 展示截止日</text>
  </g>

  <rect x="52" y="890" width="1696" height="58" rx="20" fill="#ffffff"/>
  <text x="900" y="927" text-anchor="middle" class="body">统一时区 Asia/Shanghai　·　统一日期 yyyyMMdd　·　统一分区 ds STRING　·　金额 DECIMAL(20,2)</text>
</svg>
